# KYAULabs first-party Semgrep rules pack
#
# Each rule has positive/negative fixtures in tests/Semgrep/<RuleId>/
# and is validated by tests/Unit/Semgrep/RulesPackTest.php.
#
# New rules follow TDD: write fixture + test expectation first,
# then implement the rule. Run semgrep --validate after editing.

rules:
  # --- Aurora constructor: $status must never be a literal true ---
  - id: kyaulabs-aurora-status-true-literal
    message: >-
      Aurora constructor $status is a literal 'true'. Replace with
      env_bool('APP_DEBUG') so production deployments
      never expose verbose error display to visitors. Prefer named
      arguments: status: env_bool('APP_DEBUG').
      See ADR-0002 and the aurora-page skill. Genuine exceptions use
      // nosemgrep: kyaulabs-aurora-status-true-literal -- <justification>.
    severity: ERROR
    languages: [php]
    pattern-either:
      - pattern: |
          new KYAULabs\Aurora($TEMPLATE, $CDN, true, ...);
      - pattern: |
          new KYAULabs\Aurora(..., status: true, ...);
      - pattern: |
          new \KYAULabs\Aurora($TEMPLATE, $CDN, true, ...);
      - pattern: |
          new \KYAULabs\Aurora(..., status: true, ...);
    metadata:
      category: security
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      technology:
        - php
      confidence: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/209.html
        - adr/0002-first-party-semgrep-rules-pack.md

  # --- SQL injection: request-reachable data in the SQL string of
  # query() (taint mode) ---
  # Mirrors kyaulabs-xss-echo-request-sink and
  # kyaulabs-unserialize-request-data: sources are request superglobals,
  # sink is the SQL-string (first) argument of $DB->query($SQL, ...),
  # narrowed via focus-metavariable so tainted data in the bound-params
  # array (arg 2) does NOT fire. Taint propagates through assignment,
  # concatenation, sprintf, and heredoc interpolation, so indirect flows
  # like $id = $_GET[...]; $sql = "..." . $id; $db->query($sql); are
  # caught. Safe paths: bound parameters via $DB->query("...?", [$var]),
  # and intval()/(int) integer casts.
  - id: kyaulabs-sqli-interpolated-query
    message: >-
      Request-reachable data flows into the SQL string argument of a
      query() call. Use bound parameters:
      $DB->query("SELECT ... WHERE x = ?", [$var]).
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_FILES
      - pattern: $_SERVER
    # Sanitizers: intval() and (int) integer casts neutralize taint for
    # integer contexts. The primary safe path — bound parameters passed
    # as query()'s second array argument — is already excluded by the
    # arg-1-focused sink. Suppress genuine exceptions via
    # // nosemgrep: kyaulabs-sqli-interpolated-query -- <justification>.
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval($X)
          - pattern: (int) $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB->query($SQL)
              - pattern: $DB->query($SQL, ...)
          - focus-metavariable: $SQL
    metadata:
      category: security
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      technology:
        - php
      confidence: HIGH
      likelihood: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/89.html
        - https://owasp.org/www-community/attacks/SQL_Injection
        - adr/0002-first-party-semgrep-rules-pack.md

  # --- XSS: unescaped echo/print of request-reachable data (taint mode) ---
  # Mirrors kyaulabs-unserialize-request-data: sources are request
  # superglobals, sinks are echo/print/printf (direct output). Taint
  # propagates through assignment and concatenation, so indirect flows like
  # $x = $_GET[...]; echo $x; are now caught.
  # Sanitizers: htmlspecialchars and htmlentities stop the taint flow. A
  # custom escaping wrapper will NOT be recognized — suppress with
  # // nosemgrep: kyaulabs-xss-echo-request-sink -- <justification>.
  - id: kyaulabs-xss-echo-request-sink
    message: >-
      Unescaped request superglobal written directly to output.
      Escape with htmlspecialchars($val, ENT_QUOTES | ENT_HTML5, 'UTF-8').
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_FILES
      - pattern: $_SERVER
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
    pattern-sinks:
      - pattern: echo $X;
      - pattern: print $X;
      - pattern: printf(...);
    metadata:
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      technology:
        - php
      confidence: HIGH
      likelihood: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://owasp.org/www-community/attacks/xss/
        - adr/0002-first-party-semgrep-rules-pack.md

  # --- Deserialization: unserialize on request-reachable data ---
  - id: kyaulabs-unserialize-request-data
    message: >-
      unserialize() on data reachable from a request superglobal is a
      deserialization vulnerability. Use json_decode() instead.
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_FILES
      - pattern: $_SERVER
      - pattern: file_get_contents('php://input', ...)
      - pattern: file_get_contents("php://input", ...)
    pattern-sinks:
      - pattern: unserialize(...);
    metadata:
      category: security
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      technology:
        - php
      confidence: HIGH
      likelihood: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://owasp.org/www-community/attacks/Deserialization_of_untrusted_data
        - adr/0002-first-party-semgrep-rules-pack.md

  # --- CSRF: POST form without CSRF token (heuristic, INFO) ---
  - id: kyaulabs-missing-csrf-token
    message: >-
      POST form detected without a visible CSRF token. Add an
      <input type="hidden" name="csrf_token" value="..."> inside
      the form. Token must be session-scoped and generated with
      random_bytes(). This is a heuristic — the rule suppresses
      when the word "csrf" appears within the form block, which
      does not guarantee a real hidden input. Review manually.
    severity: INFO
    languages: [generic]
    paths:
      include:
        - "*.php"
    patterns:
      - pattern-regex: '(?is)<form[^>]*method\s*=\s*["'']?post["'']?[^>]*>.*?(?:</form>|\z)'
      - pattern-not-regex: '(?i)csrf'
    metadata:
      category: security
      cwe:
        - "CWE-352: Cross-Site Request Forgery (CSRF)"
      technology:
        - generic
      confidence: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/352.html
        - https://owasp.org/www-community/attacks/csrf
        - adr/0002-first-party-semgrep-rules-pack.md

  # --- Hardcoded display_errors enabled ---
  - id: kyaulabs-hardcoded-display-errors-on
    message: >-
      display_errors is hardcoded to an enabled value (1, On, true, yes).
      Aurora manages error display via its constructor $status parameter
      (wired to env_bool('APP_DEBUG')). Do not override display_errors
      manually in application code.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern: ini_set('display_errors', $VAL);
      - metavariable-regex:
          metavariable: $VAL
          regex: '(?i)^[''"]?(1|on|true|yes)[''"]?$'
    metadata:
      category: security
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      technology:
        - php
      confidence: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/209.html
        - adr/0002-first-party-semgrep-rules-pack.md
