# prism-managed: @kyaulabs/prism-core
# prism-automation-schema: 1
name: Back-merge main to develop

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: back-merge-main-to-develop
  cancel-in-progress: false

jobs:
  back-merge:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or reuse back-merge pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! ahead_by=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...main" --jq 'if type == "object" then if (.ahead_by | type) == "number" then if .ahead_by >= 0 and (.ahead_by | floor) == .ahead_by then .ahead_by else "invalid" end else "invalid" end else "invalid" end' 2>/dev/null); then
            echo "::error::back-merge comparison failed" >&2
            exit 1
          fi
          case "$ahead_by" in
            ''|*[!0-9]*)
              echo "::error::back-merge comparison was malformed" >&2
              exit 1
              ;;
          esac
          if [ "$ahead_by" = '0' ]; then
            echo "develop already contains main; nothing to do"
            exit 0
          fi
          existing="$(gh pr list --state open --base develop --head main --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Back-merge pull request #$existing already exists."
            exit 0
          fi
          gh pr create --base develop --head main --title "chore: back-merge main into develop" --body "Automated back-merge after a successful merge into main."
