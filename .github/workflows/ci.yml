name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pi toolchain verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Configure git identity
        # resolve-identity.sh (called by the /pr title-validation block that
        # pr_command_test.sh extracts) fail-closes without a git identity.
        # actions/checkout sets none, so configure a CI identity for repo-local
        # git operations.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify protected push came from a merged PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash .github/scripts/verify-protected-push.sh

      - name: Setup PHP 8.5 with PCOV
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Validate composer.json and lock file
        run: composer validate --strict --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies (scripts disabled)
        run: composer install --no-progress --no-interaction --no-scripts

      - name: Install npm dependencies from the committed lockfile
        run: npm ci

      - name: Install pi (pinned)
        # validate-harness.sh imports the safety extension via `pi -e`, and the
        # check_skill_frontmatter shell test depends on the pi CLI. Pinned for
        # reproducibility (matches the pinned core peerDependency).
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.1

      - name: Install shellcheck 0.11.0
        # Pinned for local/CI parity with a verified SHA-256 (no curl-to-tar
        # pipe; mktemp path defeats /tmp TOCTOU pre-planting).
        env:
          SC_VERSION: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          archive="shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 \
            -o "$tmpdir/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/${archive}"
          echo "${SC_SHA256}  ${tmpdir}/${archive}" | sha256sum -c --strict -
          tar -xJ -C "$tmpdir" -f "$tmpdir/${archive}"
          mkdir -p "$HOME/.local/bin"
          mv "$tmpdir/shellcheck-v${SC_VERSION}/shellcheck" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          shellcheck --version

      - name: Install gitleaks 8.30.1
        # Pinned for local/CI parity with a verified SHA-256 (no curl-to-tar
        # pipe; mktemp path defeats /tmp TOCTOU pre-planting).
        env:
          GL_VERSION: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          archive="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 \
            -o "$tmpdir/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/${archive}"
          echo "${GL_SHA256}  ${tmpdir}/${archive}" | sha256sum -c --strict -
          tar -xz -C "$tmpdir" -f "$tmpdir/${archive}"
          mkdir -p "$HOME/.local/bin"
          mv "$tmpdir/gitleaks" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          gitleaks version

      - name: Provision Semgrep (compatible range, isolated venv)
        # Ephemeral CI environment provisioning only — Prism runtime/setup
        # verifies but never installs Semgrep (ADR-0063).
        env:
          SEMGREP_RANGE: ">=1.173.0,<2.0.0"
        run: |
          set -euo pipefail
          venv="$(mktemp -d)/semgrep-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet "semgrep${SEMGREP_RANGE}"
          echo "$venv/bin" >> "$GITHUB_PATH"
          export PATH="$venv/bin:$PATH"
          semgrep --version

      - name: Provision OCR (compatible range, scripts disabled)
        # Ephemeral CI environment provisioning only — Prism runtime/setup
        # verifies but never installs OCR (ADR-0063). CI never runs the OCR
        # connectivity test or an OCR review; only the local
        # executable/version check is exercised.
        env:
          OCR_RANGE: ">=1.9.1 <2.0.0"
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts "@alibaba-group/open-code-review@${OCR_RANGE}"
          ocr --version

      - name: Mandatory local readiness
        run: node packages/prism-core/scripts/prism-tool.js doctor --local-only

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: node packages/prism-core/scripts/prism-tool.js run playwright -- install --with-deps chromium

      - name: PHP syntax check
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './aurora/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Node tests
        run: npm run test:node

      - name: Harness validation
        run: bash packages/prism-core/scripts/validate-harness.sh

      - name: Shellcheck
        run: |
          find . -type f \( -name '*.sh' -o -path './.github/hooks/*' \) \
            -not -path './vendor/*' \
            -not -path '*/node_modules/*' \
            -not -path './aurora/*' \
            -print0 | xargs -0 shellcheck --severity=warning

      - name: Check script executable bits
        run: bash .github/scripts/check-script-executable-bits.sh

      - name: Shell regression tests
        run: composer test:shell

      - name: PHP CS Fixer (dry-run)
        run: node packages/prism-core/scripts/prism-tool.js run php-cs-fixer -- fix --dry-run --diff

      - name: Stylelint
        if: hashFiles('cdn/sass/**/*.scss') != ''
        run: node packages/prism-core/scripts/prism-tool.js run stylelint -- "cdn/sass/**/*.scss" --allow-empty-input

      - name: ESLint
        if: hashFiles('cdn/js/**/*.js', '.github/scripts/**/*.js') != ''
        run: node packages/prism-core/scripts/prism-tool.js run eslint -- "cdn/js/**/*.js" ".github/scripts/**/*.js" --ignore-pattern "*.min.js" --no-error-on-unmatched-pattern

      - name: Start PHP dev server
        if: hashFiles('tests/Browser/**/*.php') != ''
        run: |
          php -S localhost:8080 -t tests/Browser/fixtures/ > /dev/null 2>&1 &
          echo "PHP_SERVER_PID=$!" >> $GITHUB_ENV
          timeout 10 bash -c 'until curl -sf http://localhost:8080/smoke.html > /dev/null 2>&1; do sleep 0.5; done'

      - name: Pest (backend/ coverage >= 80%)
        if: hashFiles('tests/Unit/**/*.php', 'tests/Feature/**/*.php', 'tests/Integration/**/*.php', 'tests/Browser/**/*.php') != ''
        run: |
          # Aggregate backstop gate (PCOV is configured in the environment by
          # setup-php; the launcher delegates it to the consumer PHP config).
          node packages/prism-core/scripts/prism-tool.js run pest -- --coverage --min=80
          # Per-changed-file gate (mechanized, same script as /check)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              0000000000000000000000000000000000000000) BASE="HEAD~1" ;;
              *) BASE="$BEFORE" ;;
            esac
          fi
          git diff --name-only "$BASE...HEAD" -- '*.php' \
            | php .github/scripts/coverage-gate.php tests/coverage.xml
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PEST_BROWSER_BASE_URL: http://localhost:8080

      - name: Stop PHP dev server
        if: always() && hashFiles('tests/Browser/**/*.php') != ''
        run: kill $PHP_SERVER_PID 2>/dev/null || true

      - name: Semgrep SAST
        run: >-
          node packages/prism-core/scripts/prism-tool.js run semgrep --
          scan
          --config .semgrep/kyaulabs.yml
          --config p/php
          --config p/secrets
          --config p/javascript
          --error
          --metrics off
          --disable-version-check

      - name: Gitleaks SAST
        run: gitleaks detect --source . --redact --verbose --no-color

      - name: Composer audit
        run: composer audit --locked --format=json

      - name: npm audit
        run: npm audit --audit-level=low

      - name: Commitlint (PR range)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}"
          node packages/prism-core/scripts/prism-tool.js run commitlint -- --from="origin/${BASE_REF}" --to=HEAD --verbose

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Pack and smoke both packages from an unrelated consumer
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          npm pack ./packages/prism-core --ignore-scripts --pack-destination "$tmpdir" >/dev/null
          npm pack ./packages/prism-php-web --ignore-scripts --pack-destination "$tmpdir" >/dev/null
          core_tgz=$(ls "$tmpdir"/kyaulabs-prism-core-*.tgz)
          adapter_tgz=$(ls "$tmpdir"/kyaulabs-prism-php-web-*.tgz)
          tar -tzf "$core_tgz" > "$tmpdir/core.list"
          tar -tzf "$adapter_tgz" > "$tmpdir/adapter.list"
          grep -qx 'package/toolchain.json' "$tmpdir/core.list"
          grep -qx 'package/scripts/prism-tool.js' "$tmpdir/core.list"
          grep -qx 'package/toolchain.json' "$tmpdir/adapter.list"
          grep -qx 'package/scripts/prism-tool-adapter.js' "$tmpdir/adapter.list"
          # Install the core package into a temporary Pi-managed root.
          core_dir="$tmpdir/pi-root/node_modules/@kyaulabs-prism-core"
          mkdir -p "$core_dir"
          tar -xzf "$core_tgz" -C "$core_dir" --strip-components=1
          # Invoke the packaged CLI from an unrelated temporary consumer project;
          # a usage failure proves the packaged entry point executes.
          mkdir -p "$tmpdir/consumer"
          cd "$tmpdir/consumer"
          if node "$core_dir/scripts/prism-tool.js" unknown-command >/dev/null 2>&1; then
            echo "packaged CLI unexpectedly succeeded" >&2
            exit 1
          fi
          echo "package smoke PASS"
