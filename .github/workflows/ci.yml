name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, sockets
          coverage: pcov
      - run: npm ci --ignore-scripts
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: pipx install semgrep
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: node --test --test-concurrency=2 tests/Node/*.test.js tests/Node/*.test.ts
      - run: bash packages/prism-core/scripts/validate-harness.sh
      - run: bash tests/Shell/run-all.sh
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: node_modules/.bin/stylelint 'cdn/sass/**/*.scss' --allow-empty-input
      - run: node_modules/.bin/eslint 'cdn/js/**/*.js' '.github/scripts/**/*.js' --ignore-pattern '*.min.js' --no-error-on-unmatched-pattern
      - name: PHP tests and coverage
        shell: bash
        run: |
          set -euo pipefail
          port=$(node -e 'const s=require("node:net").createServer();s.listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')
          php -S "127.0.0.1:$port" -t tests/Browser/fixtures >/tmp/prism-fixture.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          export PEST_BROWSER_BASE_URL="http://127.0.0.1:$port"
          ready=false
          for attempt in 1 2 3 4 5; do
            kill -0 "$server"
            if curl -fsS --max-time 2 "$PEST_BROWSER_BASE_URL/smoke.html" -o /dev/null; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          php -d pcov.enabled=1 vendor/bin/pest --coverage
      - name: Changed PHP coverage (90 percent default)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.php' | php packages/prism-php-web/scripts/coverage-gate.php tests/coverage.xml
      - run: composer audit
      - run: npm audit --omit=dev

  packages:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/Node/package-resources.test.js
