name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_TOKEN_PRESENT: ${{ secrets.SEMGREP_APP_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .opencode/package-lock.json

      - name: Validate composer.json and lock file
        run: composer validate --strict --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --no-scripts

      - name: Install npm dependencies
        run: npm ci

      - name: Install opencode plugin dependencies
        run: cd .opencode && npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Plugin tests
        run: npm run test:plugin

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: PHP syntax check
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './aurora/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Harness validation
        run: bash .github/scripts/validate-harness.sh

      # Pin shellcheck to a specific version for local/CI parity. The runner
      # image's bundled shellcheck lags upstream stable and its exit-code
      # behavior differs from 0.11.0 (which decoupled info/style from the exit
      # code), causing info-level findings (SC2295, SC2015) to fail CI while
      # passing locally. Keep this version in sync with what developers run.
      # Issue #182: verify the pinned SHA-256 before extraction (eliminate
      # curl-to-tar pipe) and download to a mktemp path to defeat /tmp TOCTOU
      # pre-planting.
      - name: Install shellcheck 0.11.0
        env:
          SC_VERSION: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          archive="shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tmpdir/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/${archive}"
          echo "${SC_SHA256}  ${tmpdir}/${archive}" | sha256sum -c --strict -
          tar -xJ -C "$tmpdir" -f "$tmpdir/${archive}"
          mkdir -p "$HOME/.local/bin"
          mv "$tmpdir/shellcheck-v${SC_VERSION}/shellcheck" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          shellcheck --version

      - name: Shellcheck
        run: |
          find . -type f \( -name '*.sh' -o -path './.github/hooks/*' \) \
            -not -path './vendor/*' \
            -not -path '*/node_modules/*' \
            -not -path './aurora/*' \
            -print0 | xargs -0 shellcheck --severity=warning

      - name: Check script executable bits
        run: bash .github/scripts/check-script-executable-bits.sh

      - name: Check setup.json secret hygiene
        run: bash .github/scripts/check-setup-secrets.sh

      - name: Shell regression tests
        run: |
          shopt -s nullglob
          tests=( tests/Shell/*_test.sh )
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No shell tests found in tests/Shell/"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::Running $t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: PHP CS Fixer (dry-run)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Stylelint
        if: hashFiles('cdn/sass/**/*.scss') != ''
        run: npx stylelint "cdn/sass/**/*.scss" --allow-empty-input

      - name: ESLint
        if: hashFiles('cdn/js/**/*.js', '.github/scripts/**/*.js') != ''
        run: npx eslint "cdn/js/**/*.js" ".github/scripts/**/*.js" --ignore-pattern "*.min.js" --no-error-on-unmatched-pattern

      - name: Start PHP dev server
        if: hashFiles('tests/Browser/**/*.php') != ''
        run: |
          php -S localhost:8080 -t tests/Browser/fixtures/ > /dev/null 2>&1 &
          echo "PHP_SERVER_PID=$!" >> $GITHUB_ENV
          timeout 10 bash -c 'until curl -sf http://localhost:8080/smoke.html > /dev/null 2>&1; do sleep 0.5; done'

      - name: Cache pip (semgrep)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-semgrep
          restore-keys: pip-${{ runner.os }}-

      - name: Install Semgrep
        env:
          SEMGREP_VERSION: "1.168.0"
        run: |
          set -euo pipefail
          # Install semgrep into an isolated venv under a mktemp path to avoid
          # PEP 668 externally-managed-environment errors on the runner image
          # and to defeat /tmp TOCTOU pre-planting (Issue #182). pip verifies
          # package hashes from PyPI over TLS, so no separate checksum gate is
          # needed here — only the curl-based downloads above require it.
          venv="$(mktemp -d)/semgrep-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$venv/bin" >> "$GITHUB_PATH"
          export PATH="$venv/bin:$PATH"
          semgrep --version

      - name: Pest (coverage >= 80%)
        if: hashFiles('tests/Unit/**/*.php', 'tests/Feature/**/*.php', 'tests/Integration/**/*.php', 'tests/Browser/**/*.php') != ''
        run: |
          # Aggregate backstop gate
          php vendor/bin/pest --coverage --min=80
          # Per-changed-file gate (mechanized, same script as /check)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              0000000000000000000000000000000000000000) BASE="HEAD~1" ;;
              *) BASE="$BEFORE" ;;
            esac
          fi
          git diff --name-only "$BASE...HEAD" -- '*.php' \
            | php .github/scripts/coverage-gate.php tests/coverage.xml
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PEST_BROWSER_BASE_URL: http://localhost:8080

      - name: Stop PHP dev server
        if: always() && hashFiles('tests/Browser/**/*.php') != ''
        run: kill $PHP_SERVER_PID 2>/dev/null || true

      - name: Semgrep App (findings dashboard)
        if: ${{ env.SEMGREP_TOKEN_PRESENT == 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci --metrics off --disable-version-check

      - name: Semgrep SAST
        run: >-
          semgrep scan
          --config .semgrep/kyaulabs.yml
          --config p/php
          --config p/secrets
          --config p/javascript
          --error
          --metrics off
          --disable-version-check

      # Pin gitleaks to a specific version for local/CI parity (same rationale
      # as the shellcheck pin above). Binary install avoids the Docker
      # dependency that gitleaks-action@v3 required — Docker just for a secrets
      # scan is absurd overhead on the runner.
      # Issue #182: verify the pinned SHA-256 before extraction (eliminate
      # curl-to-tar pipe) and download to a mktemp path to defeat /tmp TOCTOU
      # pre-planting.
      - name: Install gitleaks 8.30.1
        env:
          GL_VERSION: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          archive="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tmpdir/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/${archive}"
          echo "${GL_SHA256}  ${tmpdir}/${archive}" | sha256sum -c --strict -
          tar -xz -C "$tmpdir" -f "$tmpdir/${archive}"
          mkdir -p "$HOME/.local/bin"
          mv "$tmpdir/gitleaks" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          gitleaks version

      - name: Gitleaks SAST
        run: gitleaks detect --source . --redact --verbose --no-color

      - name: Commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}"
          npx commitlint --from="origin/${BASE_REF}" --to="HEAD" --verbose

  check-macos:
    name: macOS Eval & Shell
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: macOS version diagnostics
        run: |
          echo "=== sw_vers ==="
          sw_vers
          echo "=== uname ==="
          uname -a
          echo "=== bash version ==="
          bash --version | head -1

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer

      - name: Validate composer.json and lock file
        run: composer validate --strict --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .opencode/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Homebrew bash 5 + GNU coreutils
        run: |
          brew install bash coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Check script executable bits
        shell: bash
        run: bash .github/scripts/check-script-executable-bits.sh

      - name: Check setup.json secret hygiene
        shell: bash
        run: bash .github/scripts/check-setup-secrets.sh

      - name: Shell regression tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=( tests/Shell/*_test.sh )
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No shell tests found in tests/Shell/"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::Running $t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: Eval unit tests
        run: php vendor/bin/pest tests/Unit/Eval
